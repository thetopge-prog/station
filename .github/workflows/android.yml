# يبني تطبيق «ستيشن — المتصل» وينشره كإصدار يمكن تنزيله بلا حساب GitHub.
#
# المحل يفتح  station-anbar.netlify.app/apk  على الهاتف فيصله الملف مباشرة
# (التحويل في netlify.toml). لا حساب، ولا كمبيوتر، ولا كابل.
name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # مفتاح توقيع **ثابت**، يُولَّد مرة واحدة ويُودَع في المستودع.
      #
      # وهذا هو بيت القصيد: بلا مفتاح ثابت يُوقَّع كل بناء بمفتاح مختلف،
      # فيرفض الهاتف التحديث ويُجبر المحل على حذف التطبيق وإعادة تثبيته —
      # وفقدان العنوان وكلمة السر في كل مرة.
      #
      # وما يمنحه هذا المفتاح لمن يقرؤه: بناء نسخة يقبلها هذا الهاتف كتحديث.
      # وذلك يحتاج الهاتف في يده أصلاً. وكلمة سرّ النظام ليست هنا ولن تكون —
      # تُكتب على الهاتف مرة واحدة.
      - name: Create the signing key once, and keep it
        run: |
          if [ ! -f android/station.keystore ]; then
            keytool -genkeypair -v -keystore android/station.keystore \
              -storepass station -keypass station -alias station \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Station, O=Station, L=Ramadi, C=IQ"
            git config user.name  "station-ci"
            git config user.email "ci@station.iq"
            git add android/station.keystore
            git commit -m "Android: the fixed signing key, so updates install over each other"
            git push
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name it something a person can read
        run: cp android/app/build/outputs/apk/release/app-release.apk station.apk

      # tag_name ثابت + latest ⇒ رابط دائم لا يتغيّر مع كل بناء
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ستيشن — المتصل ${{ github.run_number }}
          files: station.apk
          body: |
            نزّله على هاتف المطعم من: station-anbar.netlify.app/apk
